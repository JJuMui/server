name: Labeler

on:
  issues:
    types:
      - opened
      - edited
  pull_request:
    types:
      - opened
      - reopened
  pull_request_target:
    types:
      - opened
      - reopened

jobs:
  main:
    runs-on: ubuntu-latest

    permissions:
      contents: read       # 위에 작성한 설정 파일을 읽기 위해 필요
      issues: write        # 이슈에 라벨을 추가하기 위해 필요
      pull-requests: write # PR에 라벨을 추가하기 위해 필요

    steps:
      - name: Labeler
        uses: actions/labeler@v5.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
